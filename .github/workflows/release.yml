name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-linux:
    name: Build Linux releases (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Update version in Cargo.toml to match tag
        run: |
          # Extract version from tag (remove 'v' prefix)
          # Use inputs.tag for workflow_dispatch, github.ref_name for tag push
          if [ -n "${{ inputs.tag }}" ]; then
            TAG_VERSION="${{ inputs.tag }}"
          else
            TAG_VERSION="${{ github.ref_name }}"
          fi
          
          if [[ "$TAG_VERSION" == v* ]]; then
            VERSION="${TAG_VERSION:1}"
          else
            VERSION="$TAG_VERSION"
          fi
          echo "Tag: $TAG_VERSION -> Version: $VERSION"
          
          # Verify Cargo.toml exists and has version line
          if ! grep -q '^version = ' Cargo.toml; then
            echo "ERROR: Could not find version line in Cargo.toml"
            exit 1
          fi
          
          # Store original version for comparison
          ORIGINAL_VERSION=$(grep '^version = ' Cargo.toml | head -1)
          echo "Original: $ORIGINAL_VERSION"
          
          # Update Cargo.toml version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          
          # Verify the update was successful
          UPDATED_VERSION=$(grep '^version = ' Cargo.toml | head -1)
          echo "Updated:  $UPDATED_VERSION"
          
          if ! echo "$UPDATED_VERSION" | grep -q "\"$VERSION\""; then
            echo "ERROR: Version update failed. Expected version = \"$VERSION\""
            exit 1
          fi
          
          echo "✓ Version successfully updated to $VERSION"
      
      - name: Install build dependencies
        run: |
          chmod +x scripts/install-build-deps.sh
          ./scripts/install-build-deps.sh
      
      - name: Build Linux releases
        run: |
          chmod +x scripts/build-linux.sh
          ./scripts/build-linux.sh
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podcast-tui-linux-${{ matrix.arch }}-releases
          path: releases/
          retention-days: 30

  build-windows:
    name: Build Windows releases
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Update version in Cargo.toml to match tag
        shell: pwsh
        run: |
          # Extract version from tag (remove 'v' prefix)
          # Use inputs.tag for workflow_dispatch, github.ref_name for tag push
          $tagVersion = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          
          if ($tagVersion.StartsWith('v')) {
            $version = $tagVersion.Substring(1)
          } else {
            $version = $tagVersion
          }
          Write-Host "Tag: $tagVersion -> Version: $version"
          
          # Verify Cargo.toml exists and has version line
          $versionLine = Get-Content Cargo.toml | Select-String -Pattern '^version\s*='
          if (-not $versionLine) {
            Write-Error "ERROR: Could not find version line in Cargo.toml"
            exit 1
          }
          
          # Store original version for comparison
          $originalVersion = $versionLine.Line
          Write-Host "Original: $originalVersion"
          
          # Update Cargo.toml version - use same pattern as bash for consistency
          $content = Get-Content Cargo.toml
          $newContent = $content -replace '^version = ".*"', ('version = "' + $version + '"')
          $newContent | Set-Content Cargo.toml
          
          # Verify the update was successful
          $updatedLine = Get-Content Cargo.toml | Select-String -Pattern '^version = '
          $updatedVersion = $updatedLine.Line
          Write-Host "Updated:  $updatedVersion"
          
          # Precise check: version must be in quotes (not just substring match)
          $expectedPattern = '"' + [regex]::Escape($version) + '"'
          if ($updatedVersion -notmatch $expectedPattern) {
            Write-Error "ERROR: Version update failed. Expected version = `"$version`" but got: $updatedVersion"
            exit 1
          }
          
          Write-Host "✓ Version successfully updated to $version" -ForegroundColor Green
      
      - name: Install build dependencies
        shell: pwsh
        run: |
          ./scripts/install-build-deps.ps1
      
      - name: Build Windows releases
        shell: pwsh
        run: |
          ./scripts/build-releases-windows.ps1
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podcast-tui-windows-releases
          path: releases/
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
      - name: Download Linux x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: podcast-tui-linux-x86_64-releases
          path: releases/
      
      - name: Download Linux aarch64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: podcast-tui-linux-aarch64-releases
          path: releases/
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: podcast-tui-windows-releases
          path: releases/
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            releases/**/*.zip
            releases/**/*.tar.gz
            releases/**/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}

  test-builds:
    name: Test release artifacts (${{ matrix.label }})
    needs: [build-linux, build-windows]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            artifact: podcast-tui-linux-x86_64-releases
            os: Linux
            arch_suffix: linux-x86_64
          - label: linux-aarch64
            runner: ubuntu-24.04-arm
            artifact: podcast-tui-linux-aarch64-releases
            os: Linux
            arch_suffix: linux-aarch64
          - label: windows-x86_64
            runner: windows-latest
            artifact: podcast-tui-windows-releases
            os: Windows
            arch_suffix: windows-x86_64
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: releases/
      
      - name: Test Linux binary
        if: matrix.os == 'Linux'
        run: |
          cd releases/v*/
          tar -xzf *${{ matrix.arch_suffix }}.tar.gz
          cd *${{ matrix.arch_suffix }}/
          chmod +x podcast-tui
          ./podcast-tui --version || true
      
      - name: Test Windows binary
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          cd releases/v*
          Expand-Archive -Path *${{ matrix.arch_suffix }}.zip -DestinationPath .
          cd *${{ matrix.arch_suffix }}
          ./podcast-tui.exe --version

  update-flake-hashes:
    name: Open PR to bump nix/release-hashes.nix
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Use a token with PR-create permission so the bot PR can be opened.
          token: ${{ secrets.WINGET_SUBMIT_TOKEN }}
      
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Wait for release assets to publish
        # GH Releases sometimes lag a few seconds after `create-release`.
        run: sleep 30
      
      - name: Regenerate nix/release-hashes.nix
        run: bash scripts/update-flake-hashes.sh ${{ steps.tag.outputs.tag }}
      
      - name: Open PR with updated hashes
        env:
          GH_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BRANCH="chore/nix-hashes-${TAG}"
          
          if git diff --quiet -- nix/release-hashes.nix; then
            echo "No hash changes detected — nothing to do."
            exit 0
          fi
          
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add nix/release-hashes.nix
          
          COMMIT_MSG="$(cat <<EOF
          chore(nix): bump release hashes for ${TAG}
          
          Auto-generated by .github/workflows/release.yml after publishing ${TAG}.
          Updates nix/release-hashes.nix so \`nix run github:lqdev/podcast-tui\`
          serves the prebuilt binary for this release.
          
          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          EOF
          )"
          git commit -m "$COMMIT_MSG"
          git push -u origin "$BRANCH"
          
          PR_BODY="$(cat <<EOF
          Auto-generated by the release workflow after publishing **${TAG}**.
          
          Regenerates \`nix/release-hashes.nix\` so flake users immediately get the prebuilt binary instead of falling back to source. Safe to merge once CI is green.
          EOF
          )"
          gh pr create \
            --title "chore(nix): bump release hashes for ${TAG}" \
            --body  "$PR_BODY" \
            --base  main \
            --head  "$BRANCH"
